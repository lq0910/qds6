# 功能：GPUI Kit 原生应用入口；时间：2026-11-10；作者：lq。
[package]
name = "qds6-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "qds6"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
qds6-core.workspace = true
qds6-storage.workspace = true
directories.workspace = true

# 功能：仅显式验收时启用 GPUI 测试支持，不进入常规构建；时间：2026-11-10；作者：lq。
[features]
ui-tests = ["gpui-kit/test-support"]
# 功能：显式启用 M0 组件实验窗口，不进入正式客户端；时间：2026-11-10；作者：lq。
component-lab = []

[[example]]
name = "ui-smoke"
required-features = ["ui-tests"]

[[example]]
name = "component-lab"
required-features = ["component-lab"]

[[example]]
name = "component-smoke"
required-features = ["ui-tests"]

[lints]
workspace = true
