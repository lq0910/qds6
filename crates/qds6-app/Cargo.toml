# 功能：GPUI Kit 原生应用入口；时间：2026-11-10；作者：lq。
[package]
name = "qds6-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "qds6"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
qds6-core.workspace = true
qds6-storage.workspace = true
qds6-services.workspace = true
serde_json.workspace = true
uuid.workspace = true
zeroize = "1"
directories.workspace = true
# 功能：以系统本地时区显示文件修改时间；时间：2026-11-11；作者：lq。
chrono = "0.4"

# 功能：仅显式验收时启用 GPUI 测试支持，不进入常规构建；时间：2026-11-10；作者：lq。
[features]
ui-tests = ["gpui-kit/test-support", "qds6-services/test-support"]
# 功能：显式启用 M0 组件实验窗口，不进入正式客户端；时间：2026-11-10；作者：lq。
component-lab = []

[[example]]
name = "ui-smoke"
required-features = ["ui-tests"]

[[example]]
name = "component-lab"
required-features = ["component-lab"]

[[example]]
name = "component-smoke"
required-features = ["ui-tests"]

[[example]]
name = "service-ui-smoke"
required-features = ["ui-tests"]

# 功能：运行隔离布局和标签交互验收；时间：2026-11-11；作者：lq。
[[example]]
name = "layout-smoke"
required-features = ["ui-tests"]

# 功能：隔离配置下验证文件夹分组完整交互；时间：2026-11-11；作者：lq。
[[example]]
name = "group-smoke"
required-features = ["ui-tests"]

# 功能：实际接收 macOS 原生外观通知，验收自动主题；时间：2026-11-11；作者：lq。
[[example]]
name = "appearance-smoke"
required-features = ["ui-tests"]

[lints]
workspace = true

# 功能：只连接本机专用 SSH 的服务器状态原生验收；时间：2026-11-11；作者：lq。
[[example]]
name = "server-status-smoke"
required-features = ["ui-tests"]

# 功能：终端留白、连接侧栏与隐藏文件专项验收；时间：2026-11-11；作者：lq。
[[example]]
name = "sidebar-files-smoke"
required-features = ["ui-tests"]

# 功能：多表网格、查询和断开连接的原生验收；时间：2026-11-11；作者：lq。
[[example]]
name = "database-grid-smoke"
required-features = ["ui-tests"]
